[feeds]
feed_dir = "nvd_feeds"
start_year = 2002
max_age_hours = 24

[cache]
cache_file = "cve_cache.json"
enabled = true

[server_scan]
inventory_file = "server_inventory.csv"
max_workers = 5
exclude_dirs = [
    "/proc",
    "/sys",
    "/dev",
    "/run",
    "/boot",
    "/var/log",
    "/var/cache",
    "/var/tmp",
    "/tmp",
    "/lost+found",
    "/media",
    "/mnt",
    "/srv",
    "/var/lib/docker",
    "/var/lib/containerd",
    "/var/lib/flatpak",
    "/var/lib/snapd",
    "/var/lib/rpm",
    "/var/lib/dpkg",
    "/var/lib/apt",
    "/usr/share/doc",
    "/usr/share/man"
]

[output]
output_dir = "."
formats = ["json", "csv", "html", "excel"]

[logging]
log_file = "vuln-checker.log"
level = "INFO"

[security]
excluded_cpes_file = "excluded_cpes.txt"

[license_policy]
enabled = false
fail_on_violation = false
allowed_licenses = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Python-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Public-Domain",
    "CC0-1.0",
    "Unlicense",
    "Zlib"
]
denied_licenses = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "SSPL",
    "Commons-Clause"
]
