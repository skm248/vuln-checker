name: Update License Year

on:
  schedule:
    - cron: '0 0 1 1 *'
  push:
    branches:
      - main

jobs:
  update-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Year
        run: |
          CURRENT_YEAR=$(date +'%Y')
          sed -i -E "s/Copyright \(c\) [0-9]{4} Skm248/Copyright (c) $CURRENT_YEAR Skm248/g" LICENSE

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "chore: update license copyright year to $(date +'%Y')" && git push)