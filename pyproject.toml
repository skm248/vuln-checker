[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-checker"
version = "0.5.6a1"
authors = [
  { name="skm248" },
]
description = "High-performance CLI CVE vulnerability scanner for servers and SBOMs"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.32.4",
    "packaging>=23.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "toml>=0.10.2",
    "tomli>=2.0.1",
    "tqdm>=4.65.0",
    "urllib3>=2.6.0",
]

[project.scripts]
vuln-checker = "vuln_checker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vuln_checker*"]

[tool.setuptools.package-data]
vuln_checker = ["data/*", "templates/*.html"]

[tool.setuptools]
include-package-data = true
